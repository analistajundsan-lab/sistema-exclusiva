name: DB Backup (Neon)

# Backup automatico diario do banco de producao (Neon / São Paulo).
# O dump é CRIPTOGRAFADO (AES256) antes de virar artifact — inutil sem a
# passphrase (secret BACKUP_PASSPHRASE). Ver docs/BACKUPS.md para restaurar.

on:
  schedule:
    - cron: '0 6 * * *'      # 06:00 UTC = 03:00 BRT (madrugada, baixo movimento)
  workflow_dispatch: {}        # permite rodar manualmente pela aba Actions

concurrency:
  group: db-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # issues: write apenas neste job, para o passo de alerta abrir/comentar
    # issue quando o backup falha (gatilhos sao schedule/dispatch — nunca
    # roda em contexto de PR de fork, entao o token nao vaza para forks).
    permissions:
      contents: read
      issues: write
    steps:
      - name: Instalar PostgreSQL client 17
        run: |
          set -euo pipefail
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          # o runner ja traz o client 16; garante que o 17 tenha precedencia
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump + validação + criptografia
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y%m%d_%H%M%S)"
          FILE="neon_backup_${STAMP}.dump"
          # dump em formato custom (comprimido)
          pg_dump "$DATABASE_URL" -Fc --no-owner --no-privileges -f "$FILE"
          # guarda-corpo: falha o job se o dump vier sem tabelas de dados
          N="$(pg_restore -l "$FILE" | grep -c 'TABLE DATA' || true)"
          echo "Tabelas com dados no dump: $N"
          test "$N" -gt 0
          # criptografa (AES256) e descarta o dump em claro
          gpg --batch --yes --symmetric --cipher-algo AES256 \
              --passphrase "$PASSPHRASE" -o "${FILE}.gpg" "$FILE"
          rm -f "$FILE"
          echo "ARTIFACT=${FILE}.gpg" >> "$GITHUB_ENV"

      - name: Upload do backup criptografado
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.ARTIFACT }}
          retention-days: 30
          if-no-files-found: error

      # A falha do backup era SILENCIOSA (so aparecia na aba Actions).
      # Este passo transforma qualquer falha do job em issue aberta com a
      # label backup-failure — ou comenta na issue ja aberta, evitando spam.
      - name: Falha do backup vira issue (alerta nao-silencioso)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # garante a label (tolerante a "ja existe")
          gh label create backup-failure \
            --repo "$GITHUB_REPOSITORY" \
            --color D93F0B \
            --description "Falha no backup diario do banco (Neon)" \
            || true
          STAMP="$(date -u '+%Y-%m-%d %H:%M UTC')"
          EXISTING="$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --state open --label backup-failure --limit 1 \
            --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" \
              --body "Backup falhou de novo em ${STAMP}: ${RUN_URL}"
          else
            BODY="$(printf 'O backup diario do banco de producao (Neon) FALHOU.\n\n- Run: %s\n- Data: %s\n\n**Lembrete operacional:** 5+ falhas consecutivas deste workflow = padrao classico de cota de TRANSFERENCIA (egress) do Neon Free estourada — foi exatamente o sintoma dos incidentes de 07/2026 e 08/2026. Verificar o dashboard do Neon ANTES de suspeitar do workflow.\n\nRestauracao e detalhes: docs/BACKUPS.md.' "$RUN_URL" "$STAMP")"
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Backup diário do banco FALHOU — verificar Neon" \
              --label backup-failure \
              --body "$BODY"
          fi

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'exclusiva-api'
    static_configs:
      # servico "backend" do docker-compose (rede interna) — "localhost"
      # dentro do container do Prometheus apontaria para ele mesmo.
      - targets: ['backend:8000']
    metrics_path: '/metrics'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
